# rules/models.yaml — model profiles, host defaults and catalogs (HARNESS.md §2).
# Profile resolution: defaults → first family whose `match` regex is found in the model id (case-insensitive)
# → family.kinds[<provider kind>] → per-provider overrides from Model Test → clamp.
# Facts verified 2026-11-08 against ollama.com/library and @mlc-ai/web-llm v0.2.87 prebuiltAppConfig.
version: 2

defaults:
  family: default
  contextWindow: 4096
  systemRole: true
  jsonSchema: true
  thinking: NONE                 # NONE | TAGS (<think>…</think> in content) | FIELD (separate field, e.g. Ollama message.thinking)
  disableThinking: NONE          # NONE | OLLAMA_THINK_FALSE | NO_THINK_SUFFIX | WEBLLM_EXTRA_BODY
  khmerNative: false
  maxOutputTokens: 1024
  topP: 0.9
  repeatPenalty: 1.1
  tokenFactor: 1.0

# Models the host AI service uses (overridable by env: OLLAMA_CHAT_MODEL, OLLAMA_EMBED_MODEL, GUARD_CONTENT_MODEL).
host:
  chatModel: "gemma4:e2b-it-qat"     # ~4.3 GB download, 128K max context (we request 8192)
  embedModel: "embeddinggemma"       # 300M params, 768-dim output, 2K input tokens
  guardModel: "llama-guard3:1b"      # optional content-safety classifier, ~1.6 GB

# First match wins, so more specific entries come first.
families:
  - family: qwen3.5
    match: ['qwen3\.5', 'qwen3_5']
    contextWindow: 8192
    thinking: FIELD
    disableThinking: OLLAMA_THINK_FALSE
    kinds:
      BROWSER: { contextWindow: 4096, thinking: TAGS, disableThinking: WEBLLM_EXTRA_BODY }

  - family: qwen3-instruct-2507
    match: ['qwen3:.*instruct-2507', 'qwen3-.*instruct-2507']
    contextWindow: 8192
    thinking: NONE
    disableThinking: NONE

  - family: qwen3
    match: ['qwen3']
    contextWindow: 8192
    thinking: FIELD
    disableThinking: OLLAMA_THINK_FALSE
    kinds:
      BROWSER: { contextWindow: 4096, thinking: TAGS, disableThinking: WEBLLM_EXTRA_BODY }

  - family: qwen2.5
    match: ['qwen2\.5', 'qwen2_5']
    contextWindow: 8192
    kinds:
      BROWSER: { contextWindow: 4096 }

  - family: gemma4
    match: ['gemma4', 'gemma-4']
    contextWindow: 8192
    thinking: FIELD                  # Ollama returns reasoning in message.thinking; off by default
    disableThinking: OLLAMA_THINK_FALSE
    kinds:
      BROWSER: { contextWindow: 4096, thinking: NONE, disableThinking: NONE }

  - family: gemma3
    match: ['gemma3', 'gemma-3']
    contextWindow: 8192
    kinds:
      BROWSER: { contextWindow: 4096, systemRole: false }   # Gemma 3 has no native system role; Ollama's template merges it, WebLLM does not

  - family: gemma2
    match: ['gemma2', 'gemma-2']
    contextWindow: 4096
    kinds:
      BROWSER: { systemRole: false }

  - family: llama3.2
    match: ['llama3\.2', 'llama-3\.2']
    contextWindow: 8192
    kinds:
      BROWSER: { contextWindow: 4096 }

  - family: phi
    match: ['phi-?3', 'phi-?4']
    contextWindow: 4096

  - family: smollm2
    match: ['smollm2']
    contextWindow: 2048
    maxOutputTokens: 512

  - family: minicpm
    match: ['minicpm']
    contextWindow: 4096
    thinking: FIELD
    disableThinking: OLLAMA_THINK_FALSE

  - family: deepseek-r1
    match: ['deepseek-r1']
    contextWindow: 8192
    thinking: FIELD
    disableThinking: NONE            # cannot be turned off; reasoning is always stripped

# Shown in "Try instantly in your browser". vramMb = WebLLM vram_required_MB (q4f16_1). Every q4f16_1 build needs the
# WebGPU "shader-f16" feature; when the GPU lacks it (e.g. Firefox), the frontend uses fallbackId (q4f32_1) instead.
browserCatalog:
  - id: "Qwen3.5-2B-q4f16_1-MLC"
    fallbackId: "Qwen3.5-2B-q4f32_1-MLC"
    label: "Qwen 3.5 · 2B (recommended)"
    vramMb: 2245
    fallbackVramMb: 2592
    recommended: true
  - id: "Qwen3.5-0.8B-q4f16_1-MLC"
    fallbackId: "Qwen3.5-0.8B-q4f32_1-MLC"
    label: "Qwen 3.5 · 0.8B (fastest)"
    vramMb: 1629
    fallbackVramMb: 1894
    recommended: false
  - id: "Llama-3.2-1B-Instruct-q4f16_1-MLC"
    fallbackId: "Llama-3.2-1B-Instruct-q4f32_1-MLC"
    label: "Llama 3.2 · 1B (fast)"
    vramMb: 879
    fallbackVramMb: 1129
    recommended: false
  - id: "Qwen2.5-1.5B-Instruct-q4f16_1-MLC"
    fallbackId: "Qwen2.5-1.5B-Instruct-q4f32_1-MLC"
    label: "Qwen 2.5 · 1.5B"
    vramMb: 1630
    fallbackVramMb: 1889
    recommended: false
  - id: "gemma-4-E2B-it-q4f16_1-MLC"
    fallbackId: "gemma-4-E2B-it-q4f32_1-MLC"
    label: "Gemma 4 · E2B (best quality, needs a strong GPU)"
    vramMb: 3387
    fallbackVramMb: 3863
    recommended: false
  - id: "Qwen3.5-4B-q4f16_1-MLC"
    fallbackId: "Qwen3.5-4B-q4f32_1-MLC"
    label: "Qwen 3.5 · 4B (high quality, needs a strong GPU)"
    vramMb: 3868
    fallbackVramMb: 4680
    recommended: false

# Shown in the "Connect my Ollama" guide (sizes from ollama.com/library, 2026-11-08).
ollamaSuggestions:
  - { tag: "qwen3.5:2b",        label: "Qwen 3.5 · 2B",          sizeGb: 2.7, note: "Good balance for most laptops" }
  - { tag: "qwen3.5:0.8b",      label: "Qwen 3.5 · 0.8B",        sizeGb: 1.2, note: "Fastest; lower quality" }
  - { tag: "qwen3:1.7b",        label: "Qwen 3 · 1.7B",          sizeGb: 1.4, note: "Small and fast" }
  - { tag: "gemma4:e2b-it-qat", label: "Gemma 4 · E2B (QAT)",    sizeGb: 4.3, note: "Best quality here; needs 8 GB+ RAM" }
