[project]
name = "lumen-ai-service"
version = "0.1.0"
description = "Lumen AI service: harness core (rules, guardrails, retrieval, grounding) and model runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "httpx>=0.27",
    "ollama>=0.4",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pypdf==6.21.2",
    "python-docx==1.2.0",
    "khmercut==0.2.0",
    "ctranslate2==4.8.3",
    "sentencepiece==0.2.2",
    "trafilatura==2.3.1",
    "rembg[cpu]==2.0.85",   # background removal; model isnet-general-use (Apache-2.0), never bria-rmbg
]

[dependency-groups]
# Opt-in FLUX.2 [klein] image generation on Apple Silicon: `./setup.sh --images` (adds torch; ~4.6 GB model).
images = ["mflux==0.23.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[tool.uv]
# Supply-chain rule: never install a release younger than ~2 weeks (bump this date when updating).
exclude-newer = "2026-10-25T00:00:00Z"
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
